{% extends "base.html" %}

{% load static %}

{% block head %}
{% endblock %}

{% block title %}
    Добавить кампанию
{% endblock %}

{% block content %}
    <form action="" method="post">
        {% csrf_token %}
        <div class="row">
            <div class="col"></div>
            <div class="col">
                <label for="campaignName">Название кампании</label>
                <input id="campaignName" name="name" class="form-control" required>
            </div>
            <div class="col"></div>
        </div>

        <div class="row">
            <div class="col"></div>
            <div class="col">
                <label for="campaignDesc">Описание</label>
                <textarea id="campaignDesc" name="description" class="form-control"></textarea>
            </div>
            <div class="col"></div>
        </div>

        <div class="row">
            <div class="col"></div>
            <div class="col">
                <label for="campaignFields">Поля (выберите несколько)</label>
                <select id="campaignFields" name="fields" class="form-control" multiple required size="8">
                    {% for field in fields %}
                        <option value="{{ field.id }}">{{ field.name }}</option>
                    {% endfor %}
                </select>
                <small class="form-text text-muted">Зажмите Ctrl для выбора нескольких полей</small>
            </div>
            <div class="col"></div>
        </div>

        <div class="row">
            <div class="col"></div>
            <div class="col">
                <label for="gridStep">Ширина облета (м)</label>
                <input id="gridStep" name="grid_step" type="number" step="1" value="100" class="form-control" required>
            </div>
            <div class="col"></div>
        </div>

        <div class="row">
            <div class="col"></div>
            <div class="col">
                <label for="truckSpeed">Скорость машины (км/ч)</label>
                <input id="truckSpeed" name="truck_speed" type="number" step="1" value="40" class="form-control" required>
            </div>
            <div class="col"></div>
        </div>

        <div class="row">
            <div class="col"></div>
            <div class="col">
                <label for="startPrice">Цена за старт ($)</label>
                <input id="startPrice" name="start_price" type="number" step="0.1" value="3" class="form-control">
            </div>
            <div class="col"></div>
        </div>

        <div class="row">
            <div class="col"></div>
            <div class="col">
                <label for="hourlyPrice">Цена за час ($)</label>
                <input id="hourlyPrice" name="hourly_price" type="number" step="0.1" value="10" class="form-control">
            </div>
            <div class="col"></div>
        </div>

        <div class="row">
            <div class="col"></div>
            <div class="col">
                <label for="campaignDrones">Дроны</label>
                <select id="campaignDrones" name="drones" class="form-control" multiple required>
                    {% for drone in drones %}
                        <option value="{{ drone.id }}">{{ drone.name }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col"></div>
        </div>

        <div class="row">
            <div class="col" style="text-align: center;">
                <button class="btn btn-primary" style="margin-top: 10px;">Сохранить кампанию</button>
            </div>
        </div>
    </form>
{% endblock %}

{% block foot %}
{% endblock %}
